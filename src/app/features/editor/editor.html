<kf-panel-section title="Partir d'un modèle">
  <div class="flex flex-wrap gap-2">
    @for (template of templates; track template.id) {
      <kf-button variant="ghost" [small]="true" (pressed)="applyTemplate(template.id, template.label)">
        {{ template.label }}
      </kf-button>
    }
  </div>
  @if (editor.beforeTemplate()) {
    <p class="m-0 text-xs text-muted" role="status">
      {{ templateNotice() }}
      <button type="button" class="cursor-pointer underline underline-offset-[3px]" (click)="undoTemplate()">
        Annuler
      </button>
    </p>
  }
</kf-panel-section>

<kf-panel-section title="Calques">
  <div class="flex flex-wrap gap-1.5">
    @for (item of addable; track item.type) {
      <kf-button variant="ghost" [small]="true" (pressed)="editor.add(item.type)">+ {{ item.label }}</kf-button>
    }
  </div>
  <kf-layer-list />
</kf-panel-section>

<kf-panel-section [title]="propsTitle()">
  <kf-layer-properties />
</kf-panel-section>

<kf-panel-section title="Ton style">
  <div class="flex flex-wrap gap-2">
    <kf-button variant="ghost" [small]="true" (pressed)="saveStyle()">Enregistrer (.json)</kf-button>
    <kf-file-button label="Ouvrir un style…" accept="application/json,.json" (picked)="openStyle($event)" />
  </div>
  <p class="m-0 text-xs text-muted" role="status">{{ fileNotice() }}</p>
</kf-panel-section>
