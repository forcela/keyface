<ul class="m-0 grid list-none gap-1 p-0">
  @for (row of rows(); track row.layer.id) {
    <li
      class="flex items-center gap-0.5 rounded-[10px] border p-[3px] pr-1"
      [class]="row.layer.id === editor.selectedId() ? 'border-fg bg-surface' : 'border-line bg-sunk'"
    >
      <ss-icon-button
        [icon]="row.layer.visible ? 'eye' : 'eye-off'"
        [label]="row.layer.visible ? 'Masquer' : 'Afficher'"
        (pressed)="editor.update(row.layer.id, { visible: !row.layer.visible })"
      />
      <button
        type="button"
        class="min-w-0 flex-1 cursor-pointer truncate px-1.5 py-1 text-left text-[13px] font-medium"
        [class.text-muted]="!row.layer.visible"
        [class.line-through]="!row.layer.visible"
        [attr.aria-current]="row.layer.id === editor.selectedId()"
        (click)="editor.select(row.layer.id)"
      >
        {{ name(row.layer) }}
      </button>
      <ss-icon-button icon="up" label="Monter" [disabled]="!row.canRaise" (pressed)="editor.reorder(row.layer.id, 1)" />
      <ss-icon-button icon="down" label="Descendre" [disabled]="!row.canLower" (pressed)="editor.reorder(row.layer.id, -1)" />
      <ss-icon-button
        icon="copy"
        label="Dupliquer"
        [disabled]="row.layer.type === 'background'"
        (pressed)="editor.duplicate(row.layer.id)"
      />
      <ss-icon-button
        icon="trash"
        label="Supprimer"
        [disabled]="row.layer.type === 'background'"
        (pressed)="editor.remove(row.layer.id)"
      />
    </li>
  }
</ul>
